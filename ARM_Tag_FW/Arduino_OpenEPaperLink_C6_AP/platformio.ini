[platformio]
src_dir = .

[env:seeed_xiao_esp32c6]
; Requires pioarduino (Arduino 3.x / IDF 5.x) for IEEE 802.15.4 support on C6
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = seeed_xiao_esp32c6
framework = arduino
monitor_speed = 115200
build_flags =
    ; Seeed XIAO ESP32-C6: D2=GPIO20 (UART1 RX), D3=GPIO21 (UART1 TX)
    -D CONFIG_OEPL_HARDWARE_UART_TX=21
    -D CONFIG_OEPL_HARDWARE_UART_RX=20
